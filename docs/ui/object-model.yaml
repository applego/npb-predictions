version: 1
objects:
  - name: シーズン
    collection: /rankings
    identity: year
    attributes: [年度, リーグ, 確定状態, 更新日時, 収録範囲, 採用根拠, ロック日時の欠測]
    actions: [年度を選ぶ, リーグを選ぶ, 公式順位を確認する]
  - name: 解説者の予想結果
    collection: /rankings?year=:year&league=:league
    detail: /rankings?year=:year&league=:league#predictor-:id
    identity: userId
    attributes: [名前, 出典, 順位予想点, 一致数, 順位差合計, 同順位, 球団別予想, 実順位]
    actions: [名前と出典で探す, 全順位一致で絞る, 評価指標を切り替える, 内訳を開く, 出典を見る, Xで共有する, リンクをコピーする, 結果カードを保存する]
    related: [シーズン, 球団]
  - name: 球団
    identity: slug
    attributes: [名前, リーグ, 予想順位, 実順位, 順位差]
  - name: 観戦ガイド
    collection: /resources
    attributes: [用途, 掲載元, PR表示, 公式の中継案内]
    actions: [視聴方法を調べる]
  - name: 自分の予想
    collection: /rankings/commentators?year=:year
    identity: 認証された本人と年度
    attributes: [名前, 球団別予想, 読み込み状態, 未登録, 取得失敗]
    actions: [比較へ追加する, 再取得する]
    related: [シーズン, 解説者の予想結果]
  - name: 解説者の予想比較
    collection: /rankings/commentators
    identity: yearとleague
    attributes: [選択年度, 対象リーグ, 並び順, 比較する解説者, 画像の列数]
    actions: [年度を選ぶ, リーグで絞る, 並べ替える, 比較画像を保存する]
    related: [シーズン, 解説者の予想結果, 自分の予想]
  - name: 予想一覧
    collection: /sheet?year=:year&league=:league
    identity: yearとleagueと選んだ予想者と自分の予想
    attributes: [年度, リーグ, 確定状態, 実際の順位, 予想者, 表示名, 球団別予想, 的中数, ずれ合計, 点数, 並び順]
    actions: [自分の予想を入れる, 並べる解説者を選ぶ, 並べ替える, 一覧を画像で保存する, Xで共有する]
    related: [シーズン, 解説者の予想結果, 球団]
    # 自分の予想と表示名はURLにだけ持ち、サーバーへ保存しない。画像は端末内で生成する。
url_state: [year, league, q, perfect, sort, '#predictor-id', picks, me, order]
forbidden_terms: [的中率100パーセント保証, 歴代最高]
  # 結果カードは解説者の予想結果の画像projection。端末内で生成し、外部送信しない。
